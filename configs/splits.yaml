# Validation split carved out of the 47 DSEC-Det training sequences (since 2026-10-13).
# New runs select checkpoints on "val" and train on "train_core" (= train minus val); the 13 test
# sequences are only used for the final report. Versions #1-#12 were trained on all 47 sequences and
# selected on test ("--split legacy" reproduces that).
# Chosen for coverage: 5,413 frames (9.6 %), one night sequence, every class with >= 600 boxes.
val_sequences:
  - interlaken_00_g
  - zurich_city_01_d
  - zurich_city_04_d
  - zurich_city_05_b
  - zurich_city_09_e

# OVD fine-tuning sequences (text-encoder LoRA + detector), chosen by tools/select_ovd_split.py
# (seed 0, n 12, target 0.25). "owod" = train_core minus these.
ovd_sequences:
  - interlaken_00_c
  - thun_00_a
  - zurich_city_01_a
  - zurich_city_01_b
  - zurich_city_01_c
  - zurich_city_01_e
  - zurich_city_02_d
  - zurich_city_08_a
  - zurich_city_09_a
  - zurich_city_16_a
  - zurich_city_18_a
  - zurich_city_19_a
